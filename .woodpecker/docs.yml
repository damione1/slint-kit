# SPDX-License-Identifier: GPL-3.0-or-later
# Pull requests must also stay disabled in the server's repository settings.
when:
  - event: push
    branch: main
    repo: damione1/slint-kit
  - event: manual
    repo: damione1/slint-kit

labels:
  platform: linux/amd64

clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0
    settings:
      partial: false
      depth: 0
      tags: true

steps:
  - name: docs
    image: slint-kit-ci:rust-1.99.1-v1
    commands:
      - bash .woodpecker/run.sh docs
