name: Check
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # main is never cancelled: a cancelled run on a merge commit would fail the
  # release gate and discard its bundle job.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
jobs:
  docs-bundle:
    # Compile the WASM preview bundle once per merged commit and keep it in R2, so
    # that the release tag restores it instead of compiling it again.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-bundle.yml
    secrets: inherit
  windows:
    runs-on: windows-2025
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Check public build helper on Windows
        run: cargo check -p kit-tests --locked
      - name: Test project creation on Windows
        run: cargo test -p slint-kit-cli --locked
      - name: Test build helper path handling
        run: cargo test -p slint-kit-build --locked
  linux:
    # Components use the Slint testing backend and software renderer; the
    # documentation consumers are compiled only. No display server is needed.
    runs-on: ubuntu-24.04
    # The full Linux check took 58m51s on the previous upgrade; keep room for
    # edition 1.19 code generation without dropping any validation stages.
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slint-kit-linux
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Install Linux development libraries
        # xcb and xkbcommon: winit X11 path; fontconfig: Skia and system fonts;
        # libwayland-dev: rfd (native pickers) links wayland-backend at build
        # time instead of loading it at run time like the winit backend.
        run: |
          sudo timeout 600 apt-get update
          sudo timeout 600 apt-get install -y --no-install-recommends \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libwayland-dev python3-pil
      - name: Check documentation dependency versions
        run: python3 -B docs/scripts/sync-doc-versions.py --check
      - name: Check documentation lockfiles
        # A stale slint-kit version in these locks fails every --locked docs build.
        run: |
          for manifest in docs/preview/Cargo.toml docs/workspace-preview/Cargo.toml; do
            cargo metadata --manifest-path "$manifest" --locked --format-version 1 > /dev/null
          done
      - name: Check committed captures without recapturing
        # Stale captures must fail Check on main, never the release tag.
        env:
          DOCS_BUILD_MODE: local
        run: python3 docs/scripts/capture_pipeline.py check
      - name: Check the workspace and headless component suite
        env:
          # Two concurrent rustc processes on the generated UI crates each pass
          # 7 GB and exhaust the 16 GB runner (exit 143). Compile one at a time.
          CARGO_BUILD_JOBS: '1'
        run: |
          printf 'Available CPUs: '
          nproc
          free -m
          df -h .
          ulimit -a
          for kit_limit in memory.max memory.swap.max; do
            if [ -r "/sys/fs/cgroup/$kit_limit" ]; then
              printf '%s: ' "$kit_limit"
              cat "/sys/fs/cgroup/$kit_limit"
            fi
          done
          kit_report_resources() {
            date -u '+Resources at %Y-%m-%dT%H:%M:%SZ'
            awk '/^(MemAvailable|SwapFree):/' /proc/meminfo
            for kit_metric in memory.current memory.peak memory.events; do
              if [ -r "/sys/fs/cgroup/$kit_metric" ]; then
                printf '%s: ' "$kit_metric"
                cat "/sys/fs/cgroup/$kit_metric"
              fi
            done
            ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,8p'
          }
          kit_report_resources
          (while sleep 30; do kit_report_resources; done) &
          kit_monitor_pid=$!
          trap 'kill "$kit_monitor_pid" 2>/dev/null || true; wait "$kit_monitor_pid" 2>/dev/null || true' EXIT
          set +e
          cargo run -p xtask --locked -- check
          kit_check_status=$?
          set -e
          kit_report_resources || true
          exit "$kit_check_status"
      - name: Check generated desktop and Web projects
        env:
          SLINT_WEB_TARGET_DIR: ${{ github.workspace }}/target/scaffold-web
        run: python3 docs/scripts/check-scaffolding.py --web
      - name: Check component starters against the local kit
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python3 docs/scripts/check-starters.py --mode local
      - name: Check complete documentation applications against the local kit
        run: |
          python3 -B -m unittest discover -s docs/scripts -p 'test_complete_consumers.py'
          python3 docs/scripts/check-complete-consumers.py --mode local
      - name: Test release and documentation publication safeguards
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -B -m unittest discover -s docs/scripts -p 'test_*.py'
      - name: Record failed documentation input identities
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'docs/scripts')
          from doc_inputs import runtime_inputs
          destination = Path('docs/.generated/inputs/runtime.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(runtime_inputs(), indent=2, sort_keys=True))
          PYTHON
      - name: Upload failed documentation input identities
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-input-diagnostics
          retention-days: 7
          include-hidden-files: true
          path: |
            docs/.generated/inputs/manifest.json
            docs/.generated/inputs/runtime.json
            docs/.generated/inputs/compiler.log
            docs/.generated/inputs/catalogue--integer-field--en--light.rs
