name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
jobs:
  windows:
    runs-on: windows-2025
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Check public build helper on Windows
        run: cargo check -p kit-tests --locked
      - name: Test build helper path handling
        run: cargo test -p slint-kit-build --locked
  linux:
    # Linux checks build the kit, exercise the headless component suite on the
    # Slint testing backend with the software renderer, and check Linux cfg
    # paths with clippy. Formatting, generated files, token lint and quickstart
    # guards are file-level checks with no platform dependency; the macOS job
    # runs them. Nothing here opens a window, so no display server is needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slint-kit-linux
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Install Linux development libraries
        # xcb and xkbcommon: winit X11 path; fontconfig: Skia and system fonts;
        # libwayland-dev: rfd (native pickers) links wayland-backend at build
        # time instead of loading it at run time like the winit backend.
        run: |
          sudo timeout 600 apt-get update
          sudo timeout 600 apt-get install -y --no-install-recommends \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libwayland-dev
      - name: Run the headless component suite
        run: cargo test -p kit-tests --locked
      - name: Test the rest of the workspace
        run: cargo test --workspace --exclude kit-tests --locked
      - name: Clippy with warnings denied on Linux targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slint-kit-workspace
          cache-workspace-crates: true
      - name: Check documentation dependency versions
        run: python3 -B docs/scripts/sync-doc-versions.py --check
      - run: cargo run -p xtask --locked -- check
      - name: Check component starters against the local kit
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python3 docs/scripts/check-starters.py --mode local
      - name: Check complete documentation applications against the local kit
        run: |
          python3 -B -m unittest discover -s docs/scripts -p 'test_complete_consumers.py'
          python3 docs/scripts/check-complete-consumers.py --mode local
      - name: Test release and documentation publication safeguards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
