name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask --locked -- check
      - name: Check component starters against the local kit
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python3 docs/scripts/check-starters.py --mode local
      - name: Test release and documentation publication safeguards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
  documentation:
    uses: ./.github/workflows/documentation-build.yml
    with:
      mode: local
