name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
jobs:
  windows:
    runs-on: windows-2025
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Check public build helper on Windows
        run: cargo check -p kit-tests --locked
      - name: Test project creation on Windows
        run: cargo test -p slint-kit-cli --locked
      - name: Test build helper path handling
        run: cargo test -p slint-kit-build --locked
  linux:
    # Components use the Slint testing backend and software renderer; the
    # documentation consumers are compiled only. No display server is needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: slint-kit-linux
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Install Linux development libraries
        # xcb and xkbcommon: winit X11 path; fontconfig: Skia and system fonts;
        # libwayland-dev: rfd (native pickers) links wayland-backend at build
        # time instead of loading it at run time like the winit backend.
        run: |
          sudo timeout 600 apt-get update
          sudo timeout 600 apt-get install -y --no-install-recommends \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libwayland-dev
      - name: Check documentation dependency versions
        run: python3 -B docs/scripts/sync-doc-versions.py --check
      - name: Check the workspace and headless component suite
        run: |
          printf 'Available CPUs: '
          nproc
          free -m
          df -h .
          ulimit -a
          for kit_limit in memory.max memory.swap.max; do
            if [ -r "/sys/fs/cgroup/$kit_limit" ]; then
              printf '%s: ' "$kit_limit"
              cat "/sys/fs/cgroup/$kit_limit"
            fi
          done
          kit_report_resources() {
            date -u '+Resources at %Y-%m-%dT%H:%M:%SZ'
            awk '/^(MemAvailable|SwapFree):/' /proc/meminfo
            for kit_metric in memory.current memory.peak memory.events; do
              if [ -r "/sys/fs/cgroup/$kit_metric" ]; then
                printf '%s: ' "$kit_metric"
                cat "/sys/fs/cgroup/$kit_metric"
              fi
            done
            ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,8p'
          }
          kit_report_resources
          (while sleep 30; do kit_report_resources; done) &
          kit_monitor_pid=$!
          trap 'kill "$kit_monitor_pid" 2>/dev/null || true; wait "$kit_monitor_pid" 2>/dev/null || true' EXIT
          set +e
          cargo run -p xtask --locked -- check
          kit_check_status=$?
          set -e
          kit_report_resources || true
          exit "$kit_check_status"
      - name: Check generated desktop and Web projects
        env:
          SLINT_WEB_TARGET_DIR: ${{ github.workspace }}/target/scaffold-web
        run: python3 docs/scripts/check-scaffolding.py --web
      - name: Check component starters against the local kit
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python3 docs/scripts/check-starters.py --mode local
      - name: Check complete documentation applications against the local kit
        run: |
          python3 -B -m unittest discover -s docs/scripts -p 'test_complete_consumers.py'
          python3 docs/scripts/check-complete-consumers.py --mode local
      - name: Test release and documentation publication safeguards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
