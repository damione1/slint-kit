name: Check
on: [push, pull_request]
jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask --locked -- check
      - name: Check the published-crate component starters
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo check --manifest-path docs/quickstart/button/Cargo.toml --locked
          cargo check --manifest-path docs/quickstart/combobox/Cargo.toml --locked
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: npm --prefix docs run build
