name: Check
on: [push, pull_request]
jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask --locked -- check
      - name: Check the published-crate component starters
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          for manifest in docs/quickstart/*/Cargo.toml; do
            cargo check --manifest-path "$manifest" --locked
          done
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: docs/preview -> ../../target/doc-previews
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci --prefix docs
      - uses: actions/cache@v4
        with:
          path: docs/.cache/previews
          key: ${{ runner.os }}-docs-previews-v1-${{ github.sha }}
          restore-keys: ${{ runner.os }}-docs-previews-v1-
      - run: python3 -m unittest discover -s docs/scripts -p 'test_web_cache.py'
      - run: npm --prefix docs run build
