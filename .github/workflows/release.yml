name: Publish crates and GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        id: rust_cache
        with:
          shared-key: slint-kit-workspace
          cache-workspace-crates: true
      - name: Seed the 0.7.1 shared cache from the previous verified macOS build
        if: github.ref_name == 'v0.7.1' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          key: v0-rust-desktop-Darwin-arm64-fc985acc-f99a2aab
          path: |
            ${{ env.CARGO_HOME }}/bin
            ${{ env.CARGO_HOME }}/.crates.toml
            ${{ env.CARGO_HOME }}/.crates2.json
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ github.workspace }}/target
      - name: Check release safeguards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_release.py'
      - name: Validate release tag and versions
        run: python3 .github/scripts/release.py validate
      - name: Check workspace
        run: cargo run -p xtask --locked -- check
      - name: Verify all five package archives
        run: >-
          cargo package --locked
          -p slint-kit-core -p slint-kit-slint -p slint-kit-native
          -p slint-kit-build -p slint-kit
      - name: Check archives and existing registry versions
        run: python3 .github/scripts/release.py check
      - name: Publish libraries and GitHub Release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish
