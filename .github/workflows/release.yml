name: Publish crates and documentation
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Check release safeguards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_release.py'
      - name: Validate release tag and versions
        run: python3 .github/scripts/release.py validate
      - name: Record the validated release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check workspace
        run: cargo run -p xtask --locked -- check
      - name: Verify all six package archives
        run: >-
          cargo package --locked
          -p slint-kit-core -p slint-kit-slint -p slint-kit-native -p slint-kit-tailwind
          -p slint-kit-build -p slint-kit
      - name: Check archives and existing registry versions
        run: python3 .github/scripts/release.py check
      - name: Publish libraries in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 .github/scripts/release.py publish
  documentation:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
    uses: ./.github/workflows/documentation-build.yml
    with:
      mode: release
      version: ${{ needs.publish.outputs.version }}
  deploy:
    needs: [publish, documentation]
    uses: ./.github/workflows/documentation-deploy.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      source: ${{ needs.documentation.outputs.source }}
      artifact: ${{ needs.documentation.outputs.artifact }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
