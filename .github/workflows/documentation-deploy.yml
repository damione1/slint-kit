name: Deploy verified documentation artifact
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source:
        type: string
        required: true
      artifact:
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: slint-kit-production
      cancel-in-progress: false
    env:
      DOCS_RELEASE_VERSION: ${{ inputs.version }}
      DOCS_SOURCE_SHA: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: docs/_site/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify the exact tested artifact and prevent an older publication
        run: >-
          python3 .github/scripts/docs_deploy.py guard
          --version "$DOCS_RELEASE_VERSION" --source "$DOCS_SOURCE_SHA"
      - name: Deploy the tested artifact to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          npx --yes wrangler@4.154.0 deploy --config docs/wrangler.toml --message "Slint Kit $DOCS_RELEASE_VERSION documentation $DOCS_SOURCE_SHA"
