[package]
name = "kit-showcase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kit = { workspace = true, features = ["native"] }
slint = { workspace = true, features = ["backend-winit", "renderer-software", "unstable-winit-030"] }
png = "=0.18.1"
url = "=2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
kit-tailwind.workspace = true
kit-build.workspace = true

[features]
default = ["skia"]
skia = ["slint/renderer-skia"]
software = ["slint/renderer-software"]

[lints]
workspace = true
