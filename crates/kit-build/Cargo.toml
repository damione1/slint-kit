[package]
name = "slint-kit-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Build-time companion of Slint Kit: compiles your Slint UI with the `@kit` component library imports"

include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
kit-core.workspace = true
kit-slint = { workspace = true, default-features = false }
slint-build = { workspace = true, features = ["experimental-module-builds"] }

[lints]
workspace = true
