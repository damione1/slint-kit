[package]
name = "slint-kit"
links = "kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Rust GUI components for desktop and mobile with Slint: typed forms, virtualized tables, date pickers and light/dark themes"

include = ["build.rs", "src/**", "Cargo.toml", "README.md", "LICENSE", "THIRD-PARTY-NOTICES.md"]

[dependencies]
slint.workspace = true
kit-core.workspace = true
kit-native = { workspace = true, optional = true }
kit-slint = { workspace = true, features = ["adapter"] }

[features]
default = []
native = ["dep:kit-native"]
native-winit = ["native", "slint/unstable-winit-030"]

[lints]
workspace = true

[dev-dependencies]
i-slint-backend-testing = "~1.18.1"
