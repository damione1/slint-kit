[package]
name = "slint-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Composable native Slint controls with shared interaction behavior"

include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "THIRD-PARTY-NOTICES.md"]

[dependencies]
kit-core.workspace = true
kit-native = { workspace = true, optional = true }
kit-slint = { workspace = true, features = ["adapter"] }

[features]
default = []
native = ["dep:kit-native"]

[lints]
workspace = true
