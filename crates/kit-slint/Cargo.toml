[package]
name = "slint-kit-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Slint Kit model projections, weak bindings and public Slint components"
include = ["src/**", "ui/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
kit-core.workspace = true
slint = { workspace = true, optional = true }

[features]
default = ["adapter"]
adapter = ["dep:slint"]

[lints]
workspace = true
