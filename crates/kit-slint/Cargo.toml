[package]
name = "kit-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Slint Kit model projections, weak bindings and public Slint components"
include = ["src/**", "ui/**", "tests/**", "Cargo.toml", "LICENSE"]

[dependencies]
kit-core.workspace = true
slint = { workspace = true, optional = true }

[features]
default = ["adapter"]
adapter = ["dep:slint"]

[lints]
workspace = true
