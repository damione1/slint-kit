[package]
name = "slint-kit-slint"
links = "kit_slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Slint Kit model projections, weak bindings and public Slint components"
include = ["build.rs", "src/**", "ui/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "THIRD-PARTY-NOTICES.md"]

[dependencies]
kit-core.workspace = true
slint = { workspace = true, optional = true }
web-time = { version = "1.1", optional = true }

[features]
default = ["adapter"]
adapter = ["dep:slint", "dep:web-time", "dep:wasm-bindgen", "dep:web-sys"]

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "EventTarget", "ClipboardEvent", "DataTransfer"] }

[build-dependencies]
slint-build = { workspace = true, features = ["experimental-module-builds"] }
