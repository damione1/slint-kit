[package]
name = "kit-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kit-core.workspace = true
kit-slint = { workspace = true, features = ["adapter"] }
slint.workspace = true

[build-dependencies]
kit-tailwind.workspace = true
kit-build.workspace = true

[dev-dependencies]
# The software rasterizer lets the icon tests render pixels headlessly.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
