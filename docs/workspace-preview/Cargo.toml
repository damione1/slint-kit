[package]
name = "slint-kit-workspace-preview"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
slint-kit = { path = "../../crates/kit" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg"] }
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams"] }

[build-dependencies]
slint-kit-build = { path = "../../crates/kit-build" }
slint-build = "=1.18.1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[workspace]
