[package]
name = "kit-docs-integration"
default-run = "kit-docs-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kit-docs-table"
path = "src/table.rs"

[[bin]]
name = "kit-docs-dialog"
path = "src/dialog.rs"

[dependencies]
slint-kit = { workspace = true }
slint = { workspace = true, features = ["backend-winit", "renderer-skia"] }
png = "=0.18.1"

[build-dependencies]
kit-build.workspace = true

[lints]
workspace = true
