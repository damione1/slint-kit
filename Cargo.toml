[workspace]
members = ["crates/kit-core", "crates/kit-slint", "crates/kit-build", "crates/kit", "crates/kit-native", "showcase", "tests", "xtask", "docs/capture", "docs/integration"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
# Slint Kit is licensed under GNU GPL version 3 or, at your option, any later version.
license = "GPL-3.0-or-later"
repository = "https://github.com/damione1/slint-kit"
homepage = "https://slint-kit.dev"
keywords = ["slint", "gui", "widgets", "native", "toolkit"]
categories = ["gui"]

[workspace.dependencies]
kit-core = { package = "slint-kit-core", path = "crates/kit-core", version = "=0.4.0" }
kit-slint = { package = "slint-kit-slint", path = "crates/kit-slint", version = "=0.4.0", default-features = false }
kit-build = { package = "slint-kit-build", path = "crates/kit-build", version = "=0.4.0" }
kit-native = { package = "slint-kit-native", path = "crates/kit-native", version = "=0.4.0" }
kit = { package = "slint-kit", path = "crates/kit", version = "=0.4.0" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "accessibility"] }
slint-build = "=1.18.1"

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
