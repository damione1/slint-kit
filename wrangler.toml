name = "slint-kit"
main = "docs/worker.mjs"
compatibility_date = "2026-10-23"
workers_dev = true
preview_urls = true

[assets]
directory = "./docs/_site"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1

[[routes]]
pattern = "slint-kit.dev"
custom_domain = true

[[routes]]
pattern = "www.slint-kit.dev"
custom_domain = true

[[routes]]
pattern = "slint-kit.damiengoehrig.ca"
custom_domain = true
